[project]
name = "growth"
version = "0.0.1"
description = "Growth, an adaptive AP Calculus BC tutor, built from docs/plan"
requires-python = ">=3.12"
dependencies = [
   "fastapi",
   "sqlalchemy",
   "sympy",
   "jsonschema",
   "webauthn",
   "uvicorn",
   "pillow",
   "lark",
]

[project.optional-dependencies]
test = [
   "pytest",
   "hypothesis",
   "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_functions = ["test_*", "eval_*"]

[tool.setuptools.packages.find]
include = ["app*"]
